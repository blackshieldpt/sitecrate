name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Check that the tag matches the version
        run: test "$GITHUB_REF_NAME" = "v$(make -s version)"
      - run: make dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=
          if [[ $GITHUB_REF_NAME == *-* ]]; then prerelease=--prerelease; fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes $prerelease
