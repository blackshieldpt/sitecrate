<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>sitecrate packs a documentation site into one HTML file that opens in any browser</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1e1b4b" flood-opacity="0.12"/>
    </filter>
    <marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6366f1"/>
    </marker>
    <symbol id="check" viewBox="0 0 16 16">
      <circle cx="8" cy="8" r="8" fill="#10b981"/>
      <path d="M4.5 8.3 L7 10.6 L11.5 5.6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <rect width="1000" height="400" rx="24" fill="url(#bg)"/>

  <text x="500" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1e1b4b">Your documentation, in one file</text>
  <text x="500" y="68" text-anchor="middle" font-size="14" fill="#64748b">Pages, styles, scripts, images, fonts and search — packed together, opened anywhere</text>

  <!-- 1. the site -->
  <g filter="url(#shadow)">
    <rect x="32" y="100" width="250" height="250" rx="16" fill="#fff"/>
  </g>
  <path d="M54 124 h16 l5 5 h21 a3 3 0 0 1 3 3 v15 a3 3 0 0 1 -3 3 h-42 a3 3 0 0 1 -3 -3 v-20 a3 3 0 0 1 3 -3 z" fill="#fbbf24"/>
  <text x="110" y="137" font-size="16" font-weight="700" fill="#0f172a">docs/</text>
  <text x="110" y="154" font-size="12" fill="#64748b">Generated documentation site</text>
  <g font-size="12">
    <rect x="52" y="172" width="42" height="20" rx="5" fill="#ea580c"/>
    <text x="73" y="186" text-anchor="middle" fill="#fff" font-weight="700" font-size="10">HTML</text>
    <text x="104" y="186" fill="#334155">index.html, guide/, api/ …</text>
    <rect x="52" y="200" width="42" height="20" rx="5" fill="#2563eb"/>
    <text x="73" y="214" text-anchor="middle" fill="#fff" font-weight="700" font-size="10">CSS</text>
    <text x="104" y="214" fill="#334155">theme.css, pygments.css</text>
    <rect x="52" y="228" width="42" height="20" rx="5" fill="#facc15"/>
    <text x="73" y="242" text-anchor="middle" fill="#422006" font-weight="700" font-size="10">JS</text>
    <text x="104" y="242" fill="#334155">search.js, theme.js</text>
    <rect x="52" y="256" width="42" height="20" rx="5" fill="#059669"/>
    <text x="73" y="270" text-anchor="middle" fill="#fff" font-weight="700" font-size="10">IMG</text>
    <text x="104" y="270" fill="#334155">diagrams, screenshots</text>
    <rect x="52" y="284" width="42" height="20" rx="5" fill="#7c3aed"/>
    <text x="73" y="298" text-anchor="middle" fill="#fff" font-weight="700" font-size="10">JSON</text>
    <text x="104" y="298" fill="#334155">search index</text>
  </g>
  <text x="157" y="333" text-anchor="middle" font-size="12" fill="#94a3b8">hundreds of files to ship</text>

  <!-- arrow 1 -->
  <path d="M296 225 H386" stroke="#818cf8" stroke-width="3" fill="none" marker-end="url(#head)"/>
  <rect x="290" y="186" width="100" height="26" rx="13" fill="#1e1b4b"/>
  <text x="340" y="203" text-anchor="middle" font-size="12" fill="#e0e7ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$ sitecrate</text>

  <!-- 2. the file -->
  <g filter="url(#shadow)">
    <path d="M412 118 h108 l40 40 v170 a12 12 0 0 1 -12 12 h-136 a12 12 0 0 1 -12 -12 v-198 a12 12 0 0 1 12 -12 z" fill="url(#brand)"/>
  </g>
  <path d="M520 118 v28 a12 12 0 0 0 12 12 h28 z" fill="#c4b5fd"/>
  <text x="480" y="226" text-anchor="middle" font-size="40" font-weight="700" fill="#fff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&lt;/&gt;</text>
  <text x="480" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">manual.html</text>
  <text x="480" y="288" text-anchor="middle" font-size="12" fill="#e9d5ff">one self-contained file</text>
  <rect x="438" y="302" width="84" height="22" rx="11" fill="#ffffff" fill-opacity="0.18"/>
  <text x="480" y="317" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">gzip inside</text>

  <!-- arrow 2 -->
  <path d="M576 225 H646" stroke="#818cf8" stroke-width="3" fill="none" marker-end="url(#head)"/>
  <rect x="580" y="186" width="62" height="26" rx="13" fill="#1e1b4b"/>
  <text x="611" y="203" text-anchor="middle" font-size="12" fill="#e0e7ff">open</text>

  <!-- 3. the browser -->
  <g filter="url(#shadow)">
    <rect x="660" y="100" width="308" height="210" rx="14" fill="#fff"/>
  </g>
  <path d="M660 114 a14 14 0 0 1 14 -14 h280 a14 14 0 0 1 14 14 v18 h-308 z" fill="#f1f5f9"/>
  <circle cx="678" cy="116" r="4.5" fill="#f87171"/>
  <circle cx="693" cy="116" r="4.5" fill="#fbbf24"/>
  <circle cx="708" cy="116" r="4.5" fill="#34d399"/>
  <rect x="722" y="107" width="234" height="18" rx="9" fill="#fff"/>
  <text x="732" y="120" font-size="10" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">manual.html#/guide/install.html</text>
  <!-- sidebar -->
  <rect x="660" y="132" width="78" height="178" fill="#f8fafc"/>
  <rect x="670" y="144" width="58" height="14" rx="7" fill="#fff" stroke="#cbd5e1"/>
  <circle cx="679" cy="151" r="3" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
  <rect x="670" y="170" width="44" height="6" rx="3" fill="#6366f1"/>
  <rect x="670" y="184" width="52" height="6" rx="3" fill="#cbd5e1"/>
  <rect x="670" y="198" width="38" height="6" rx="3" fill="#cbd5e1"/>
  <rect x="670" y="212" width="48" height="6" rx="3" fill="#cbd5e1"/>
  <rect x="670" y="226" width="34" height="6" rx="3" fill="#cbd5e1"/>
  <!-- page -->
  <rect x="754" y="146" width="120" height="12" rx="4" fill="#1e1b4b"/>
  <rect x="754" y="170" width="196" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="754" y="182" width="180" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="754" y="194" width="190" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="754" y="210" width="196" height="40" rx="6" fill="#1e1b4b"/>
  <rect x="764" y="221" width="90" height="5" rx="2.5" fill="#a5b4fc"/>
  <rect x="764" y="233" width="130" height="5" rx="2.5" fill="#64748b"/>
  <rect x="754" y="262" width="186" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="754" y="274" width="150" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="754" y="286" width="170" height="6" rx="3" fill="#e2e8f0"/>

  <!-- what you get -->
  <g font-size="12" fill="#334155" font-weight="600">
    <use href="#check" x="664" y="326" width="16" height="16"/>
    <text x="686" y="338">From disk</text>
    <use href="#check" x="760" y="326" width="16" height="16"/>
    <text x="782" y="338">Any web server</text>
    <use href="#check" x="882" y="326" width="16" height="16"/>
    <text x="904" y="338">Offline</text>
  </g>
  <text x="814" y="368" text-anchor="middle" font-size="12" fill="#64748b">links, back/forward, deep links and search keep working</text>
</svg>
